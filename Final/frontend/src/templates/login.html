<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/css/navStyle.css">
  <link rel="stylesheet" href="/css/loginStyle.css">
  <script src="/js/idb.js" defer></script>
  <script src="/js/login.js" defer></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#CC0000">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
</head>
<body>
  <main>
    <h1 class="app-title">NCSU PackFinder</h1>
  
    <div class="login-container" id="login-wrapper">
      <h2>Login</h2>
      <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
      </form>
      <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
        Don't have an account? <a href="#" id="show-register" style="color: #CC0000;">Register here</a>
      </p>
    </div>

    <div class="login-container" id="register-wrapper" style="display: none;">
      <h2>Register</h2>
      <form id="register-form">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" required>

        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required>

        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required>

        <button type="submit">Register</button>
      </form>
      <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
        Already have an account? <a href="#" id="show-login" style="color: #CC0000;">Login here</a>
      </p>
    </div>
  </main>
</body>
</html>
