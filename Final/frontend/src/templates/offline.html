<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - PackFinder</title>
  <link rel="stylesheet" href="/css/navStyle.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
    .offline-icon { font-size: 80px; color: #CC0000; margin-bottom: 20px; }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 20px; line-height: 1.5; }
    button { padding: 10px 20px; background-color: #CC0000; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
  <script src="/js/idb.js" defer></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#CC0000">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
</head>
<body>
  <span class="material-symbols-outlined offline-icon">wifi_off</span>
  <h1>You're Offline</h1>
  <p>It looks like you've lost your connection to the Wolfpack network. <br>Please check your internet connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
