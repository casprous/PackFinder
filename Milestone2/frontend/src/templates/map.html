<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map</title>
  <link rel="stylesheet" href="/css/navStyle.css">
  <link rel="stylesheet" href="/css/mapStyle.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- leaflet css -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

  <script src="/js/menu.js" defer></script>
  <!-- leaflet js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    
  <script src="/js/map.js" defer></script>
</head>
<body>
  <main>
    <header class="mobile-header">
      <div class="logo">PackFinder</div>
    </header>

    <header class="top-navbar">
      <a id="menuToggle" class="menu-icon">
        <span class="material-symbols-outlined">menu</span>
      </a>
      <div class="logo">PackFinder</div>
      <div class="icons">
        <button id="notif-btn"><span class="material-symbols-outlined">notifications</span></button>
        <a href="profile.html" id="profile-btn"><span class="material-symbols-outlined">person</span></a>
      </div>
    </header>

    <nav id="drawer" class="menu">
      <h2>Menu</h2>
      <div id="menu-dropdown" class="menu-dropdown">
        <a href="home.html">Home</a>
        <a href="map.html">Map</a>
        <a href="forum.html">Forum</a>
      </div>
    </nav>

    <div class="container">
      <div class="page-title">
        <h2>Campus Map</h2>
      </div>

      <div class="search-row">
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Search posts...">
        </div>
      </div>

      <!-- legend -->
      <div class="map-legend">
        <span class="legend-item"><span class="dot lost"></span> Lost</span>
        <span class="legend-item"><span class="dot found"></span> Found</span>
        <span class="legend-item"><span class="dot turned-in"></span> Turned In</span>
        <span class="legend-item"><span class="dot desk"></span> L&amp;F Desk</span>
      </div>

      <!-- actual map renders here -->
      <div id="map-container"></div>
    </div>

    <nav class="bottom-nav">
      <button id="mobile-menu-btn"><span class="material-symbols-outlined">menu</span></button>
      <a href="map.html" id="mobile-map-btn"><span class="material-symbols-outlined">location_on</span></a>
      <button id="mobile-notif-btn"><span class="material-symbols-outlined">notifications</span></button>
      <a href="profile.html" id="mobile-profile-btn"><span class="material-symbols-outlined">person</span></a>
    </nav>
  </main>
</body>
</html>
