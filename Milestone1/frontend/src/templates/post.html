<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post</title>
  <link rel="stylesheet" href="/css/navStyle.css">
  <link rel="stylesheet" href="/css/postStyle.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <script src="/js/menu.js" defer></script>
  <script src="/js/post.js" defer></script>
</head>

<body>
  <main>
    <header class="mobile-header">
      <div class="logo">PackFinder</div>
    </header>

    <header class="top-navbar">
      <a id="menuToggle" class="menu-icon">
        <span class="material-symbols-outlined">menu</span>
      </a>
      <div class="logo">PackFinder</div>
      <div class="icons">
        <button id="notif-btn"><span class="material-symbols-outlined">notifications</span></button>
        <a href="profile.html" id="profile-btn"><span class="material-symbols-outlined">person</span></a>
      </div>
    </header>

    <nav id="drawer" class="menu">
      <h2>Menu</h2>
      <div id="menu-dropdown" class="menu-dropdown">
        <a href="home.html">Home</a>
        <a href="map.html">Map</a>
        <a href="forum.html">Forum</a>
      </div>
    </nav>

    <div class="form-container container">
      <h2 class="page-title">Create a Post</h2>
      <form id="create-post-form">
        
        <label for="title">Item Title</label>
        <input type="text" id="title" name="title" placeholder="e.g., Lost Red Backpack" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Provide details..." required></textarea>

        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g., Talley Student Center" required>

        <button type="submit">Submit Post</button>
      </form>
    </div>

    <nav class="bottom-nav">
      <button id="mobile-menu-btn"><span class="material-symbols-outlined">menu</span></button>
      <a href="map.html" id="mobile-map-btn"><span class="material-symbols-outlined">location_on</span></a>
      <button id="mobile-notif-btn"><span class="material-symbols-outlined">notifications</span></button>
      <a href="profile.html" id="mobile-profile-btn"><span class="material-symbols-outlined">person</span></a>
    </nav>
  </main>
</body>
</html>
